name: Android Build & Firebase Distribution

# Baut APK (Tester) + AAB (Play Store) ohne EAS direkt auf dem Runner
# und verteilt die APK optional über Firebase App Distribution.
#
# Nötige Repository-Secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64-kodierter Release-Keystore (optional —
#                             ohne Secret wird ein Wegwerf-Keystore erzeugt;
#                             Tester müssen bei Signaturwechsel neu installieren)
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   EXPO_PUBLIC_API_URL       Backend-URL für den Build (z. B. Railway)
#   FIREBASE_APP_ID_ANDROID   App-ID aus der Firebase-Konsole (1:…:android:…)
#   FIREBASE_SERVICE_ACCOUNT  JSON eines Service-Accounts mit Rolle
#                             "Firebase App Distribution Admin"
#   FIREBASE_TESTER_GROUPS    optional, z. B. "intern" (kommagetrennt)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag/Version für das GitHub-Release (z. B. v0.2.0)'
        required: false
        default: 'v0.2.0'
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # nötig, damit der Job ein Release erstellen + Assets anhängen kann
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/mobile

      - name: Expo prebuild (android/)
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile

      - name: Prepare signing keystore
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Keystore aus Secret übernommen"
          else
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias carmatch -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass carmatch-test -keypass carmatch-test \
              -dname "CN=CarMatch Test, O=CarMatch, C=DE"
            echo "Wegwerf-Keystore erzeugt (nur für Tests!)"
          fi

      - name: Configure signing
        working-directory: apps/mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF
          CARMATCH_UPLOAD_STORE_FILE=release.keystore
          CARMATCH_UPLOAD_STORE_PASSWORD=${KS_PASS:-carmatch-test}
          CARMATCH_UPLOAD_KEY_ALIAS=${KEY_ALIAS:-carmatch}
          CARMATCH_UPLOAD_KEY_PASSWORD=${KEY_PASS:-carmatch-test}
          EOF
          # Release-Signing in build.gradle aktivieren (ersetzt Debug-Signing des Templates)
          perl -0777 -pi -e 's/signingConfigs \{\n        debug \{/signingConfigs {\n        release {\n            storeFile file(CARMATCH_UPLOAD_STORE_FILE)\n            storePassword CARMATCH_UPLOAD_STORE_PASSWORD\n            keyAlias CARMATCH_UPLOAD_KEY_ALIAS\n            keyPassword CARMATCH_UPLOAD_KEY_PASSWORD\n        }\n        debug {/' app/build.gradle
          perl -0777 -pi -e 's/(release \{[^}]*?signingConfig signingConfigs\.)debug/${1}release/s' app/build.gradle
          grep -q 'signingConfigs.release' app/build.gradle && echo "signing ok" || { echo "signing patch failed"; exit 1; }

      - name: Build APK + AAB
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carmatch-android
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab

      # Umbenennen mit Versionsname für aussagekräftige Release-Assets
      - name: Rename release files
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "CarMatch-${TAG}.apk"
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "CarMatch-${TAG}.aab"

      - name: Create GitHub Release with APK + AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: CarMatch ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            Automatischer Android-Build (APK + AAB).

            **Installation:** `CarMatch-*.apk` herunterladen, auf dem Android-Gerät öffnen,
            „Aus unbekannter Quelle installieren" erlauben.

            Test-signiert. Die API-URL ist die zum Build-Zeitpunkt gesetzte `EXPO_PUBLIC_API_URL`
            (ohne Backend-Deploy: localhost → Fahrzeuge laden erst mit erreichbarer API).
            Details siehe CHANGELOG.md.
          files: |
            CarMatch-*.apk
            CarMatch-*.aab

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SA" ]; then
            echo "Firebase-Secrets nicht gesetzt — Verteilung übersprungen (Artefakte oben verfügbar)."
            exit 0
          fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx -y firebase-tools appdistribution:distribute \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            ${GROUPS:+--groups "$GROUPS"} \
            --release-notes "CarMatch $(git rev-parse --short HEAD) — automatischer Build"
