# Lokale Entwicklungs-Infrastruktur: PostgreSQL + Redis
# Start: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carmatch
      POSTGRES_PASSWORD: carmatch
      POSTGRES_DB: carmatch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
